# Modest Darker — Yazi flavor (Yazi 26.x)

[app]
overall = { bg = "#0b0b0b" }

[mgr]
cwd = { fg = "#d99a5e", bold = true }
find_keyword = { fg = "#e3b868", bold = true }
find_position = { fg = "black", bg = "#56b6c2" }
border_style = { fg = "#333333" }
symlink_target = { fg = "#3f3f3f" }
marker_copied = { fg = "#97ca72" }
marker_cut = { fg = "#ff616e" }
marker_marked = { fg = "#ca72e4" }
marker_selected = { fg = "black", bg = "#ca72e4" }
count_copied = { fg = "#97ca72" }
count_cut = { fg = "#ff616e" }
count_selected = { fg = "#ca72e4" }

[indicator]
parent = { fg = "#ca72e4" }
current = { fg = "#ca72e4" }
preview = { fg = "#56b6c2" }

[tabs]
active = { fg = "black", bg = "#ca72e4", bold = true }
inactive = { fg = "#7c7d7e" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "black", bg = "#97ca72", bold = true }
normal_alt = { fg = "#97ca72" }
select_main = { fg = "black", bg = "#ca72e4", bold = true }
select_alt = { fg = "#ca72e4" }
unset_main = { fg = "black", bg = "#5ab0f6", bold = true }
unset_alt = { fg = "#5ab0f6" }

[status]
overall = { fg = "#99A0A6", bg = "#0b0b0b" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#56b6c2" }
perm_read = { fg = "#97ca72" }
perm_write = { fg = "#d99a5e" }
perm_exec = { fg = "#ca72e4" }
perm_sep = { fg = "#3f3f3f" }
progress_label = { fg = "#56b6c2" }
progress_normal = { fg = "#56b6c2", bg = "#56b6c2" }
progress_error = { fg = "#ff616e", bg = "#ff616e" }

[which]
border = { fg = "#333333" }
cols = 3
mask = { fg = "black", bg = "#ca72e4", bold = true }
cand = { fg = "#99A0A6" }
rest = { fg = "#7c7d7e" }
desc = { fg = "#e3b868" }
separator = " -> "
separator_style = { fg = "#3f3f3f" }

[confirm]
border = { fg = "#333333" }
title = { fg = "#56b6c2" }
body = { fg = "#99A0A6" }
btn_yes = { fg = "black", bg = "#97ca72", bold = true }
btn_no = { fg = "#99A0A6" }

[pick]
border = { fg = "#333333" }
active = { fg = "black", bg = "#ca72e4", bold = true }
inactive = { fg = "#99A0A6" }

[input]
border = { fg = "#333333" }
title = { fg = "#56b6c2" }
value = { fg = "#99A0A6" }
selected = { fg = "black", bg = "#ca72e4" }

[help]
border = { fg = "#333333" }
chord = { fg = "#5ab0f6", bold = true }
action = { fg = "#99A0A6" }
hovered = { fg = "#98a0a7", bg = "#b45ad4", bold = true }

[filetype]
rules = [
  { url = "*/", fg = "#5ab0f6", bold = true },
  { url = "*.zip", fg = "#d99a5e" },
  { url = "*.gz", fg = "#d99a5e" },
  { url = "*.tar", fg = "#d99a5e" },
  { url = "*.7z", fg = "#d99a5e" },
  { url = "*.xz", fg = "#d99a5e" },
  { url = "*.bz2", fg = "#d99a5e" },
  { url = "*.lua", fg = "#5ab0f6" },
  { url = "*.go", fg = "#5ab0f6" },
  { url = "*.rs", fg = "#5ab0f6" },
  { url = "*.sh", fg = "#5ab0f6" },
  { url = "*.toml", fg = "#e3b868" },
  { url = "*.json", fg = "#e3b868" },
  { url = "*.yaml", fg = "#e3b868" },
  { url = "*.yml", fg = "#e3b868" },
  { url = "*.md", fg = "#97ca72" },
  { url = "*.txt", fg = "#97ca72" },
  { url = "*.png", fg = "#ca72e4" },
  { url = "*.jpg", fg = "#ca72e4" },
  { url = "*.jpeg", fg = "#ca72e4" },
  { url = "*.gif", fg = "#ca72e4" },
  { url = "*.webp", fg = "#ca72e4" },
  { url = "*.svg", fg = "#ca72e4" },
  { url = "*.ico", fg = "#ca72e4" },
  { url = "*.icns", fg = "#ca72e4" },
  { url = "*.mp3", fg = "#ff616e" },
  { url = "*.flac", fg = "#ff616e" },
  { url = "*.wav", fg = "#ff616e" },
  { url = "*.m4a", fg = "#ff616e" },
  { url = "*.mp4", fg = "#ff616e" },
  { url = "*.mkv", fg = "#ff616e" },
  { url = "*.webm", fg = "#ff616e" },
  { url = "*.mov", fg = "#ff616e" },
  { url = "*.gitignore", fg = "#3f3f3f" },
  { url = "*.gitattributes", fg = "#3f3f3f" },
  { url = "*.gitconfig", fg = "#3f3f3f" },
]

